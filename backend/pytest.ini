[pytest]
# NSA-X Backend Test Configuration

# Test paths
testpaths = tests

# Python path
pythonpath = .

# Default options
addopts = 
    -v
    --tb=short
    --strict-markers
    -ra

# Async mode
asyncio_mode = auto

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    e2e: marks tests as end-to-end tests
    security: marks tests as security-related
    critical: marks tests as critical/must-pass

# Minimum version
minversion = 7.0

# Filter warnings - be specific about what to ignore
filterwarnings =
    # Convert deprecations to errors to catch them early
    error::DeprecationWarning
    error::PendingDeprecationWarning
    # Allow specific known warnings from third-party libraries
    ignore::DeprecationWarning:jose.*
    ignore::pytest.PytestUnraisableExceptionWarning
    # Pydantic v2 migration warnings (if any remain)
    ignore:.*class-based.*config.*:DeprecationWarning:pydantic.*

# Coverage settings (if using pytest-cov)
# [coverage:run]
# source = app
# omit = 
#     tests/*
#     */migrations/*

# Logging - enable during tests for debugging
log_cli = true
log_cli_level = WARNING
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_file = pytest.log
log_file_level = DEBUG

# Test collection
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Timeout (requires pytest-timeout)
# timeout = 300
