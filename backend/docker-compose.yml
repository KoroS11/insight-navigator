# NSA-X Docker Compose Configuration
# Development environment setup
# 
# IMPORTANT: Copy .env.example to .env and set secure values before running.
# Do NOT use default credentials in production.

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: nsax-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nsax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nsax}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nsax}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: nsax-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NSA-X Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nsax-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nsax}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nsax}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      ENVIRONMENT: development
      CORS_ORIGINS: '["http://localhost:3000", "http://localhost:5173"]'
      RATE_LIMIT_PER_MINUTE: 100
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Database migrations (run once)
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nsax-migrate
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nsax}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nsax}
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    profiles:
      - migrate

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: nsax-network
